version: '3.9'

networks:
  reporting_net:
    driver: bridge

volumes:
  solr_data:
  mysql_data:
  kafka_data:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [reporting_net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [reporting_net]
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # kafka:9092  = inside Docker network (PHP containers use this)
      # localhost:29092 = from your Windows host machine
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks: [reporting_net]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic kafka-solr-csvdata --partitions 4 --replication-factor 1 &&
        kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic report_data_dlq    --partitions 1 --replication-factor 1 &&
        echo 'Topics ready.' &&
        kafka-topics --list --bootstrap-server kafka:9092
      "
    restart: "no"

  solr:
    image: solr:9.4
    container_name: solr
    networks: [reporting_net]
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
      - ./solr/configsets/csvcore:/opt/solr/server/solr/configsets/csvcore
    environment:
      SOLR_HEAP: 512m
    command: solr-precreate csvcore /opt/solr/server/solr/configsets/csvcore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/info/system"]
      interval: 10s
      timeout: 10s
      retries: 10


  mysql:
    image: mysql:8.0
    container_name: mysql
    networks: [reporting_net]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [reporting_net]
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: php
    networks: [reporting_net]
    depends_on:
      mysql:
        condition: service_healthy
      solr:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./backend:/var/www/html
      - ./backend/csvfiles:/var/www/html/csvfiles
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SOLR_HOST: solr
      SOLR_PORT: 8983
      SOLR_COLLECTION: csvcore
      KAFKA_BROKER: kafka:9092

  nginx:
    image: nginx:alpine
    container_name: nginx
    networks: [reporting_net]
    depends_on: [php, frontend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/public:/var/www/html/public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    networks: [reporting_net]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
